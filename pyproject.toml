[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedkeep"
version = "0.1.0"
description = "Offline, configuration-driven feed subscription archiver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
feedkeep = "feedkeep.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["feedkeep*", "mockserver*"]

[tool.setuptools.package-data]
mockserver = ["fixtures/*.xml", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
